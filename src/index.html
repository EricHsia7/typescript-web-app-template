  <body>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        app_name.initialize();
      });

      window.addEventListener('load', function () {
        app_name
          .registerServiceWorker()
          .then(() => {})
          .catch(() => {
            navigator.serviceWorker.register('./service-worker.js').then((registration) => {
              registration.update();
            });
          });
      });
    </script>
